name: Setup Vite+
description: Set up the repo-pinned Vite+ runtime

inputs:
  node-version-file:
    description: Node version file to pass to setup-vp
    required: false
    default: .node-version
  cache:
    description: Restore and save package-manager dependencies for this job
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Read Vite+ version
      id: versions
      shell: bash
      run: |
        version=$(sed -n 's/^  vite-plus: //p' pnpm-workspace.yaml)
        test -n "$version"
        echo "vite-plus-version=${version}" >> "$GITHUB_OUTPUT"

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        version: ${{ steps.versions.outputs.vite-plus-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.cache }}
