overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@putdotio/sdk>effect": "$effect"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@putdotio/sdk@14.0.0"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
  vite-plus: 1.5.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
