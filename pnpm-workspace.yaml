overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@putdotio/sdk>effect": "$effect"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@putdotio/*"
  - "@effect/tsgo"
  - "@effect/tsgo-*"
  - "@uinaf/oxlint-config"
  - "@uinaf/oxlint-plugin-no-comments"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  "@vitest/coverage-v8": 5.1.1
  vite-plus: 1.8.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
