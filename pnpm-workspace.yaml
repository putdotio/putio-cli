overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@putdotio/sdk>effect": "$effect"

allowBuilds:
  "@parcel/watcher": true
  "@playwright/browser-chromium": false
  "@swc/core": false
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - knip@6.31.0
  - "@uinaf/skillcheck@0.4.0"
  - "@putdotio/sdk@13.0.0"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.4
  "@vitest/coverage-v8": 5.0.4
  vite-plus: 1.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
